name: GoldSilverTracker

on:
  schedule:
    # Every 10 minutes IST → UTC = IST - 5:30
    # So 10-minute intervals IST = every 10-minute UTC with offset
    - cron: "*/10 * * * *"  # UTC time
  workflow_dispatch:  # allows manual testing too

jobs:
  track-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run tracker
        env:
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python tracker.py
